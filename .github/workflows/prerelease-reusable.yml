name: Reusable Action Pre-Release

on:
  workflow_call:
    inputs:
      target_branch:
        description: "Branch that triggered prerelease (e.g. release/v1.2.3)"
        required: true
        type: string
      validate_release_branch:
        description: "If true: require target_branch to be release/vX.Y.Z and match the computed version"
        required: false
        default: true
        type: boolean
    outputs:
      version:
        description: "Computed prerelease version (x.y.z-<shortsha>)"
        value: ${{ jobs.package.outputs.version }}
      tag:
        description: "Computed prerelease tag (v<version>)"
        value: ${{ jobs.package.outputs.tag }}

permissions:
  contents: write

concurrency:
  group: release-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  versioning:
    uses: winccoa-tools-pack/.github/.github/workflows/versioning-tags-changelog-reusable.yml@main
    with:
      mode: prerelease
      target_branch: ${{ inputs.target_branch }}
      validate_release_branch: ${{ inputs.validate_release_branch }}
      push_tag: true
      force_push_tag: true
    secrets: inherit

  package:
    needs: [versioning]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm64
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-latest
            target: win32-arm64
            cross_arch: arm64
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || github.sha }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Collect prebuilds (Node + Electron)
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          PLAT="${TARGET%%-*}"
          ARCH="${TARGET##*-}"
          CROSS_ARCH="${{ matrix.cross_arch }}"
          ELECTRON_ARCH="${CROSS_ARCH:-$ARCH}"

          # Node prebuilds: download from GitHub releases (works cross-platform)
          node scripts/collect-prebuilds.js --platform "$PLAT" --arch "$ARCH" --download-node 20.0.0 22.0.0

          # Electron prebuild: compile (with optional cross-compile arch)
          npx electron-rebuild -v 39.3.0 --arch "$ELECTRON_ARCH"
          node scripts/collect-prebuilds.js --platform "$PLAT" --arch "$ELECTRON_ARCH" --electron

      - name: Install tools
        run: npm install -g @vscode/vsce

      - name: Set prerelease metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ needs.versioning.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension (VSIX)
        run: vsce package --target ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ format('vsix-{0}', matrix.target) }}
          path: "*.vsix"
          retention-days: 14

  release:
    needs: [versioning, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - name: Build release body
        id: body
        shell: bash
        run: |
          {
            echo "body<<EOF"
            echo "${{ needs.versioning.outputs.changelog }}"
            echo ""
            echo "### 🔍 Testing Notes"
            echo "- This is a **pre-release** build; download the attached VSIX and test locally"
            echo "- Platform-specific packages: **linux-x64**, **linux-arm64**, **win32-x64**, **win32-arm64**"
            echo "- Source branch: ${{ inputs.target_branch }}"
            echo "- Report issues at: https://github.com/${{ github.repository }}/issues"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: ${{ format('🧪 Pre-Release {0}', needs.package.outputs.tag) }}
          target_commitish: ${{ inputs.target_branch != '' && inputs.target_branch || github.sha }}
          body: ${{ steps.body.outputs.body }}
          files: "dist/*.vsix"
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
